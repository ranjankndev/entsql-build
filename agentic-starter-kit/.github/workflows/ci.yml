name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check src tests
      - name: unit tests
        run: pytest -q
      # Gates that need no credentials: the offline provider exercises the whole
      # graph, so guardrails and wiring are verified on every PR.
      - name: smoke evals
        run: starter eval --suite evals/datasets/smoke.jsonl --threshold 1.0
      - name: safety evals
        run: starter eval --suite evals/datasets/safety.jsonl --threshold 1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: .eval-runs/

  quality:
    # Real-model quality runs nightly, not per-PR: model variance should not
    # block merges, but a regression must still be visible the next morning.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: core evals
        env:
          LLM_PROVIDER: azure_openai
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          OBSERVABILITY_PROVIDER: langfuse
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: starter eval --suite evals/datasets/core.jsonl --threshold 0.85
