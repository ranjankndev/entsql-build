# Guardrail policy. Edit this file, not the code, to change what is enforced.
#
#   fail_mode: block -> a BLOCK-severity hit raises GuardrailViolation
#              flag  -> the hit is recorded and the run continues (shadow mode;
#                       use this to measure a new guard before enforcing it)
fail_mode: block
block_message: >-
  I can't help with that request. If you think this is a mistake, rephrase it
  or contact support with the trace id shown below.

guards:
  - name: max_length
    options:
      max_chars: 16000

  - name: prompt_injection
    options:
      extra_patterns:
        - "exfiltrate .*(data|records)"

  - name: pii
    options:
      action: redact          # redact | block
      kinds: [email, phone, credit_card, ssn, aadhaar]

  - name: secret_leak
    options: {}

  - name: denied_topics
    options:
      topics:
        self_harm: ["how to kill myself", "suicide method"]
        weapons: ["build a bomb", "make a pipe bomb"]
        malware: ["write ransomware", "keylogger source"]

  - name: tool_allowlist
    options:
      allowed: [search_kb, calculator, now, escalate_to_human]

  # ---- model-based guards -------------------------------------------------
  # These cost a model call per turn. Turn them on deliberately, start with
  # fail_mode: flag and a sample_rate below 1.0, and read the logs before
  # enforcing. Keep the judge on a different model than the agent.

  # Hallucination check: is the answer supported by the tool results?
  # Abstains when no tool ran, so it never punishes answering from knowledge.
  - name: groundedness
    enabled: false
    options:
      threshold: 0.6
      sample_rate: 1.0
      on_error: allow        # quality check -> fail open
      severity: block

  # Free-form rubric. Write the criterion as one testable sentence.
  - name: llm_judge
    enabled: false
    options:
      name: tone
      criterion: >-
        The content is polite and professional, and does not blame the user.
      threshold: 0.5
      sample_rate: 0.2       # grade a deterministic fifth of traffic
      on_error: allow
      severity: warn

  # Enabled per project; keeps regulated answers compliant.
  - name: required_disclaimer
    enabled: false
    options:
      text_to_append: "This is general information, not professional advice."
